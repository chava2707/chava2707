<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="chava — Cartago, Costa Rica — Laravel, Docker y Next.js">
  <defs>
    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="55%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BB9AF7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.2" r="0.75">
      <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#7AA2F7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.85" r="0.6">
      <stop offset="0%" stop-color="#BB9AF7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2335" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0D1117"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>

    <circle cx="1060" cy="60" r="120" fill="none" stroke="#7AA2F7" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle cx="1060" cy="60" r="70" fill="none" stroke="#BB9AF7" stroke-opacity="0.14" stroke-width="1.5"/>

    <rect x="0" y="0" width="1200" height="4" fill="url(#lineGradient)"/>

    <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
      <text x="72" y="92" fill="#565F89" font-size="16" letter-spacing="6" font-weight="600">HOLA, SOY</text>

      <text x="68" y="182" font-size="92" font-weight="700" fill="url(#nameGradient)">chava</text>

      <text x="72" y="228" fill="#C0CAF5" font-size="22" font-weight="500">
        Desarrollador en formación · Laravel + Docker · Aprendiendo Next.js
      </text>

      <g fill="#7AA2F7" font-size="17" font-family="Cascadia Code, Consolas, Menlo, monospace">
        <circle cx="80" cy="266" r="4" fill="#BB9AF7"/>
        <text x="96" y="272" fill="#A9B1D6">Cartago, Costa Rica</text>
      </g>
    </g>

    <g transform="translate(840 108)">
      <rect width="300" height="150" rx="12" fill="#161B22" stroke="#1F2335" stroke-width="1.5"/>
      <rect width="300" height="28" rx="12" fill="#1F2335"/>
      <rect y="16" width="300" height="12" fill="#1F2335"/>
      <circle cx="18" cy="14" r="4" fill="#F7768E"/>
      <circle cx="34" cy="14" r="4" fill="#E0AF68"/>
      <circle cx="50" cy="14" r="4" fill="#9ECE6A"/>

      <g font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13">
        <text x="18" y="58" fill="#565F89">$</text>
        <text x="36" y="58" fill="#C0CAF5">php artisan serve</text>
        <text x="18" y="82" fill="#565F89">$</text>
        <text x="36" y="82" fill="#C0CAF5">docker compose up -d</text>
        <text x="18" y="106" fill="#565F89">$</text>
        <text x="36" y="106" fill="#C0CAF5">npx create-next-app</text>
        <rect x="36" y="116" width="8" height="14" fill="#7AA2F7">
          <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="18" y="138" fill="#3B4261" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="11">~/cartago · zsh</text>
    </g>

    <rect x="0" y="316" width="1200" height="4" fill="url(#lineGradient)" opacity="0.5"/>
  </g>
</svg>
